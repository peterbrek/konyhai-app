<!DOCTYPE html>
<html lang="hu">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bevásárlás">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F4F2EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151413" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<link rel="apple-touch-icon" href="ikon-telefon.png">
<title>Bevásárlás</title>
<style>
  /* Színek: világos alapértelmezés, sötét a telefon beállítása szerint. */
  :root {
    color-scheme: light dark;
    --ground: #F4F2EE;
    --surface: #FFFFFF;
    --soft: #FAF9F6;
    --field: #FFFFFF;
    --field-line: #CFCAC1;
    --ink: #1C1917;
    --muted: #5F5A52;
    --muted-2: #6B665E;
    --line: #E4E0D9;
    --line-strong: #DEDAD3;
    --divider: #EFECE6;
    --dash: #A39C90;
    --accent: #1E5A46;
    --accent-fill: #1E5A46;
    --on-accent: #FFFFFF;
    --count-bg: rgba(255, 255, 255, 0.22);
    --pending: #B45309;
    --error: #B42318;
    --error-text: #B42318;
    --error-soft: #FDF1EF;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground: #151413;
      --surface: #232120;
      --soft: #1B1A18;
      --field: #151413;
      --field-line: #4A4640;
      --ink: #F2EFEA;
      --muted: #ABA49A;
      --muted-2: #8F887E;
      --line: #3A3733;
      --line-strong: #46423D;
      --divider: #2E2C29;
      --dash: #7A7368;
      --accent: #6CC9A3;
      --accent-fill: #2B7A5C;
      --on-accent: #FFFFFF;
      --count-bg: rgba(255, 255, 255, 0.2);
      --pending: #E8A25C;
      --error: #C8372A;
      --error-text: #F28B80;
      --error-soft: #3A1E1B;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  svg { display: block; }

  .wrap { max-width: 560px; margin: 0 auto; padding: 16px 20px 128px; display: grid; grid-gap: 24px; }
  .wrap.is-edit { padding-bottom: 48px; }

  header { display: grid; grid-gap: 8px; }
  .topline { min-height: 44px; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; grid-gap: 12px; }
  .sync { margin: 0; display: grid; grid-template-columns: 8px minmax(0, 1fr); align-items: center; grid-gap: 8px; font-size: 14px; color: var(--muted); }
  .sync.no-dot { grid-template-columns: minmax(0, 1fr); }
  .dot { width: 8px; height: 8px; border-radius: 4px; background: var(--accent); }
  .link-btn { height: 44px; padding: 0 2px 0 12px; border: 0; background: transparent; color: var(--accent); font-size: 17px; font-weight: 600; }
  .link-btn.is-strong { font-weight: 700; }
  h1 { margin: 0; font-size: 34px; line-height: 1.15; font-weight: 800; letter-spacing: -0.02em; }
  .sub { margin: 2px 0 0; font-size: 16px; line-height: 1.45; color: var(--muted); }
  .progress-text { margin: 2px 0 0; font-size: 17px; font-weight: 600; color: var(--muted); }
  .bar { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
  .bar div { height: 8px; border-radius: 4px; background: var(--accent-fill); width: 0; -webkit-transition: width 200ms ease-out; transition: width 200ms ease-out; }

  .note {
    padding: 14px 6px 14px 16px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line);
    display: grid; grid-template-columns: 28px minmax(0, 1fr) 44px; grid-gap: 12px; align-items: start;
  }
  .note-icon { width: 28px; height: 28px; margin-top: 1px; border-radius: 14px; background: var(--accent-fill); display: grid; align-items: center; justify-items: center; }
  .note.is-error .note-icon { background: var(--error); }
  .note-icon svg { width: 16px; height: 16px; }
  .note-title { margin: 3px 0 2px; font-size: 17px; font-weight: 700; }
  .note-body { margin: 0; font-size: 15px; line-height: 1.4; color: var(--muted); }
  .note-close { width: 44px; height: 44px; margin-top: -8px; padding: 0; border: 0; background: transparent; color: var(--muted); display: grid; align-items: center; justify-items: center; }
  .note-close svg { width: 20px; height: 20px; }

  .card { border-radius: 16px; background: var(--surface); border: 1px solid var(--line); overflow: hidden; }
  .empty { padding: 28px 24px; display: grid; grid-gap: 6px; }
  .empty p { margin: 0; }
  .empty .big { font-size: 20px; font-weight: 700; }
  .empty .small { font-size: 16px; line-height: 1.45; color: var(--muted); }

  .sections { display: grid; grid-gap: 24px; }
  section { display: grid; grid-gap: 8px; }
  .sec-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: baseline; padding: 0 4px; }
  .sec-head h2 { margin: 0; font-size: 14px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
  .sec-head span { font-size: 14px; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }

  /* Bevásárlólista sorai */
  .row {
    width: 100%; min-height: 56px; padding: 10px 16px; border: 0; border-top: 1px solid var(--divider); background: transparent;
    display: grid; grid-template-columns: 26px minmax(0, 1fr); align-items: center; grid-gap: 14px;
    text-align: left; font-size: 19px; font-weight: 500; color: var(--ink);
  }
  .row:first-child { border-top: 0; }
  .ring { width: 26px; height: 26px; border-radius: 13px; border: 2px solid var(--dash); }
  .tick { width: 26px; height: 26px; border-radius: 13px; background: var(--accent-fill); display: grid; align-items: center; justify-items: center; }
  .tick svg { width: 16px; height: 16px; }
  .row.is-checked { color: var(--muted-2); }
  .row.is-checked .label { text-decoration: line-through; }

  /* Szerkesztő mód sorai */
  .erow {
    min-height: 52px; padding: 0 12px 0 4px; border-top: 1px solid var(--divider);
    display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; align-items: center; grid-gap: 4px;
  }
  .erow:first-child { border-top: 0; }
  .erow.is-confirm { background: var(--error-soft); padding-right: 8px; }
  .erow .name { font-size: 18px; }
  .erow.is-confirm .name { font-weight: 600; }
  .del-btn { width: 44px; height: 44px; padding: 0; border: 0; background: transparent; display: grid; align-items: center; justify-items: center; }
  .del-dot { width: 24px; height: 24px; border-radius: 12px; background: var(--error); display: grid; align-items: center; justify-items: center; }
  .del-dot svg { width: 14px; height: 14px; -webkit-transition: transform 150ms ease; transition: transform 150ms ease; }
  .erow.is-confirm .del-dot svg { -webkit-transform: rotate(90deg); transform: rotate(90deg); }
  .on-list { padding: 2px 9px; border-radius: 10px; border: 1.5px dashed var(--dash); font-size: 13px; font-weight: 600; color: var(--muted); }
  .confirm-del { height: 38px; padding: 0 16px; border: 0; border-radius: 10px; background: var(--error); color: #FFFFFF; font-size: 15px; font-weight: 700; }
  .add-row {
    width: 100%; min-height: 52px; padding: 0 12px 0 14px; border: 0; border-top: 1px solid var(--divider); background: transparent;
    display: grid; grid-template-columns: 24px minmax(0, 1fr); align-items: center; grid-gap: 14px;
    text-align: left; color: var(--accent); font-size: 18px; font-weight: 600;
  }
  .add-row.is-first, .add-form.is-first { border-top: 0; }
  .add-dot { width: 24px; height: 24px; border-radius: 12px; background: var(--accent-fill); display: grid; align-items: center; justify-items: center; }
  .add-dot svg { width: 14px; height: 14px; }
  .add-form { padding: 14px 16px 16px; border-top: 1px solid var(--divider); background: var(--soft); display: grid; grid-gap: 12px; }
  .add-form label.field-label { font-size: 14px; font-weight: 600; color: var(--muted); }
  .add-form input[type="text"] {
    width: 100%; height: 48px; padding: 0 14px; border: 2px solid var(--field-line); border-radius: 12px; background: var(--field);
    color: var(--ink); font: inherit; font-size: 18px;
  }
  .add-form input[type="text"]:focus { outline: none; border-color: var(--accent); }
  .check-line { display: grid; grid-template-columns: 22px minmax(0, 1fr); align-items: center; grid-gap: 10px; font-size: 16px; cursor: pointer; }
  .check-line input { width: 22px; height: 22px; margin: 0; accent-color: var(--accent-fill); }
  .form-error { margin: 0; font-size: 15px; font-weight: 600; color: var(--error-text); }
  .form-actions { display: grid; grid-auto-flow: column; justify-content: end; grid-gap: 10px; }
  .btn-secondary { height: 44px; padding: 0 18px; border: 2px solid var(--line-strong); border-radius: 12px; background: var(--surface); color: var(--ink); font-size: 16px; font-weight: 600; }
  .btn-primary { height: 44px; padding: 0 20px; border: 0; border-radius: 12px; background: var(--accent-fill); color: var(--on-accent); font-size: 16px; font-weight: 700; }
  .btn-primary:disabled, .btn-secondary:disabled { opacity: 0.6; cursor: default; }

  .bottom {
    position: fixed; left: 0; right: 0; bottom: 0;
    padding: 12px 20px 24px; padding-bottom: calc(16px + env(safe-area-inset-bottom));
    background: var(--ground); border-top: 1px solid var(--line);
  }
  .finish {
    display: grid; grid-auto-flow: column; justify-content: center; align-items: center; grid-gap: 10px;
    width: 100%; max-width: 520px; height: 56px; margin: 0 auto; border: 0; border-radius: 16px;
    background: var(--accent-fill); color: var(--on-accent); font-size: 19px; font-weight: 700;
  }
  .finish:disabled { background: var(--line); color: var(--muted); cursor: default; }
  .count {
    min-width: 28px; height: 28px; padding: 0 8px; border-radius: 14px; background: var(--count-bg);
    display: grid; align-items: center; justify-items: center; font-size: 15px; font-variant-numeric: tabular-nums;
  }
  .loading { margin: 0; font-size: 17px; color: var(--muted); }
</style>
</head>
<body>
<div id="wrap" class="wrap">
  <header>
    <div class="topline">
      <p id="sync" class="sync"><span id="dot" class="dot" aria-hidden="true"></span><span id="syncText">Betöltés…</span></p>
      <button type="button" id="modeBtn" class="link-btn" hidden>Szerkesztés</button>
    </div>
    <h1 id="title">Bevásárlólista</h1>
    <p id="editSub" class="sub" hidden>Törléshez koppints a piros jelre. Új terméket a kategória alján adhatsz hozzá.</p>
    <div id="progress">
      <p id="progressText" class="progress-text"></p>
      <div class="bar" style="margin-top:10px"><div id="bar"></div></div>
    </div>
  </header>
  <div id="note" class="note" role="status" hidden>
    <span class="note-icon" aria-hidden="true">
      <svg id="iconOk" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="5 12.5 10 17.5 19 7"></polyline></svg>
      <svg id="iconErr" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" style="display:none"><path d="M12 6v8"></path><path d="M12 18h.01"></path></svg>
    </span>
    <div>
      <p id="noteTitle" class="note-title"></p>
      <p id="noteBody" class="note-body"></p>
    </div>
    <button type="button" id="noteClose" class="note-close" aria-label="Értesítés bezárása">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12"></path><path d="M18 6L6 18"></path></svg>
    </button>
  </div>
  <div id="list"><p class="loading">Betöltés…</p></div>
</div>

<div id="bottom" class="bottom">
  <button type="button" id="finish" class="finish" disabled>Bevásárlás kész</button>
</div>

<script>
(function () {
  'use strict';

  /* ---------------- Kapcsolat a táblázattal ----------------
   * Az Apps Scripten belül a google.script.run hívja a szervert. Külön tárhelyen
   * (pl. GitHub Pages) a link ?api=…&kulcs=… része mondja meg, melyik webalkalmazáshoz
   * szóljon. Az app ezt meg is jegyzi, hogy a kezdőképernyőről indítva is meglegyen.
   */
  var CONN_STORE = 'konyhai_kapcsolat';
  var API_TIMEOUT_MS = 30000;
  var API_FUNCS = ['getState', 'setHave', 'addProduct', 'deleteProduct', 'finishShopping'];
  var CONN = connection();
  var KEY = CONN.key;

  function inAppsScript() {
    return !!(window.google && window.google.script && window.google.script.run);
  }

  function connection() {
    if (inAppsScript()) return { key: '<?= key ?>', api: '', ok: true };
    var q = {};
    String(window.location.search || '').replace(/^\?/, '').split('&').forEach(function (part) {
      if (!part) return;
      var i = part.indexOf('=');
      var k = i < 0 ? part : part.slice(0, i);
      var v = i < 0 ? '' : part.slice(i + 1);
      try { q[decodeURIComponent(k)] = decodeURIComponent(v.replace(/\+/g, ' ')); } catch (e) {}
    });
    var saved = {};
    try { saved = JSON.parse(localStorage.getItem(CONN_STORE) || '{}') || {}; } catch (e) {}
    var key = /^[A-Za-z0-9_-]{16,}$/.test(q.kulcs || '') ? q.kulcs : (saved.key || '');
    var api = /^[A-Za-z0-9_-]{20,}$/.test(q.api || '') ? q.api : (saved.api || '');
    if (key && api) {
      try { localStorage.setItem(CONN_STORE, JSON.stringify({ key: key, api: api })); } catch (e) {}
    }
    return { key: key, api: api ? 'https://script.google.com/macros/s/' + api + '/exec' : '', ok: !!(key && api) };
  }

  /** Ugyanúgy hívható, mint a google.script.run: server().withSuccessHandler(…).withFailureHandler(…).fn(…) */
  function server() {
    return inAppsScript() ? window.google.script.run : apiRunner(null, null);
  }

  function apiRunner(onOk, onFail) {
    var r = {
      withSuccessHandler: function (f) { return apiRunner(f, onFail); },
      withFailureHandler: function (f) { return apiRunner(onOk, f); }
    };
    API_FUNCS.forEach(function (name) {
      r[name] = function () { apiPost(name, Array.prototype.slice.call(arguments), onOk, onFail); };
    });
    return r;
  }

  function apiPost(name, args, onOk, onFail) {
    var done = false;
    function finish(ok, value) {
      if (done) return;
      done = true;
      clearTimeout(timer);
      if (ok) { if (onOk) onOk(value); }
      else if (onFail) onFail(new Error(value));
    }
    var timer = setTimeout(function () { finish(false, 'Nem jött válasz. Ellenőrizd a netkapcsolatot.'); }, API_TIMEOUT_MS);
    if (!CONN.ok) {
      finish(false, 'A link hiányos. Nyisd meg újra a táblázat Konyhai app › Hozzáférési linkek menüjéből.');
      return;
    }
    window.fetch(CONN.api, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ fn: name, args: args }),
      cache: 'no-store',
      credentials: 'omit',
      redirect: 'follow'
    }).then(function (res) {
      return res.text().then(function (text) {
        var body = null;
        try { body = JSON.parse(text); } catch (e) {}
        if (!body) {
          finish(false, res.ok
            ? 'A webalkalmazás nem adatot küldött. Frissítsd a telepítést (Telepítések kezelése › Új verzió).'
            : 'A szerver hibát jelzett (' + res.status + ').');
        } else if (body.ok) {
          finish(true, body.data);
        } else {
          finish(false, body.error || 'Ismeretlen hiba.');
        }
      });
    }).catch(function () {
      finish(false, 'Nincs kapcsolat a táblázattal. Ellenőrizd a netkapcsolatot.');
    });
  }
  var CART_KEY = 'bevasarlas_kosar';
  var REFRESH_MS = 60000;

  var CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="5 12.5 10 17.5 19 7"></polyline></svg>';
  var MINUS = '<svg viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" aria-hidden="true"><path d="M6 12h12"></path></svg>';
  var PLUS = '<svg viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" aria-hidden="true"><path d="M12 6v12"></path><path d="M6 12h12"></path></svg>';

  var S = {
    data: null,
    cart: loadCart(),     // kipipált, még nem szinkronizált termék-ID-k
    saving: false,
    error: false,
    errorMsg: '',
    mode: 'list',         // 'list' | 'edit'
    confirmDel: null,     // törlésre kijelölt termék ID
    addCat: null,         // kategória, ahol épp új terméket veszünk fel
    newName: '',
    addToList: true,
    addError: '',
    adding: false
  };

  function $(id) { return document.getElementById(id); }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  /** Hozzáférési vagy link-hiba esetén azt írja ki, egyébként általános kapcsolati hibát. */
  function loadError() {
    return /hozzáférés|link/i.test(S.errorMsg) ? S.errorMsg : 'Nincs kapcsolat – próbáld újra később';
  }

  function closest(el, selector) {
    while (el && el.nodeType === 1) {
      if (el.matches ? el.matches(selector) : el.webkitMatchesSelector(selector)) return el;
      el = el.parentNode;
    }
    return null;
  }

  function loadCart() {
    try {
      var v = JSON.parse(localStorage.getItem(CART_KEY) || '[]');
      return Array.isArray(v) ? v : [];
    } catch (e) { return []; }
  }

  function saveCart() {
    try { localStorage.setItem(CART_KEY, JSON.stringify(S.cart)); } catch (e) {}
  }

  function inCart(id) { return S.cart.indexOf(id) !== -1; }

  /* ---------------- Adatok ---------------- */

  function load() {
    if (S.saving || S.mode === 'edit') return;
    server()
      .withSuccessHandler(function (d) {
        S.data = d;
        S.error = false;
        pruneCart();
        render();
      })
      .withFailureHandler(function (err) {
        S.error = true;
        S.errorMsg = (err && err.message) || '';
        render();
      })
      .getState(KEY);
  }

  // Ami közben az iPaden „van itthon” lett vagy törlődött, az kikerül a kosárból.
  function pruneCart() {
    var missing = {};
    S.data.products.forEach(function (p) { if (!p.have) missing[p.id] = true; });
    S.cart = S.cart.filter(function (id) { return missing[id]; });
    saveCart();
  }

  function categoriesWithOrphans(filter) {
    var cats = S.data.categories.slice();
    var known = {};
    cats.forEach(function (c) { known[c.id] = true; });
    var orphans = S.data.products.some(function (p) { return filter(p) && !known[p.catId]; });
    if (orphans) cats.push({ id: '__egyeb', name: 'Egyéb' });
    return { cats: cats, known: known };
  }

  // Magyar ábécérend (cs a c után, á = a stb.), a számokat számként kezelve.
  function compareNames(a, b) {
    return a.name.localeCompare(b.name, 'hu', { numeric: true });
  }

  function productsIn(catId, known, filter) {
    return S.data.products
      .filter(function (p) {
        return filter(p) && (catId === '__egyeb' ? !known[p.catId] : p.catId === catId);
      })
      .sort(compareNames);
  }

  /* ---------------- Megjelenítés ---------------- */

  function render() {
    var editing = S.mode === 'edit';
    $('wrap').className = 'wrap' + (editing ? ' is-edit' : '');
    $('bottom').hidden = editing;
    $('progress').hidden = editing;
    $('editSub').hidden = !editing;
    $('title').textContent = editing ? 'Termékek' : 'Bevásárlólista';
    $('modeBtn').hidden = !S.data;
    $('modeBtn').textContent = editing ? 'Kész' : 'Szerkesztés';
    $('modeBtn').className = 'link-btn' + (editing ? ' is-strong' : '');

    if (!S.data) {
      setSync(S.error ? loadError() : 'Betöltés…', S.error ? 'var(--error)' : 'var(--accent)');
      $('list').innerHTML = '<p class="loading">' + (S.error ? 'Nem sikerült betölteni a listát.' : 'Betöltés…') + '</p>';
      return;
    }
    if (editing) renderEdit(); else renderList();
  }

  function setSync(text, color) {
    $('syncText').textContent = text;
    if (color) {
      $('sync').className = 'sync';
      $('dot').style.display = 'block';
      $('dot').style.background = color;
    } else {
      $('sync').className = 'sync no-dot';
      $('dot').style.display = 'none';
    }
  }

  function renderList() {
    var missingOnly = function (p) { return !p.have; };
    var meta = categoriesWithOrphans(missingOnly);
    // Kategórián belül elöl a még megveendők, a kosárba tettek (kipipáltak) a végére kerülnek; mindkettő ábécérendben.
    var secs = meta.cats.map(function (c) {
      var items = productsIn(c.id, meta.known, missingOnly);
      var todo = items.filter(function (p) { return !inCart(p.id); });
      var got = items.filter(function (p) { return inCart(p.id); });
      return { cat: c, items: todo.concat(got) };
    }).filter(function (s) { return s.items.length; });

    var total = 0;
    var done = 0;
    secs.forEach(function (s) {
      s.items.forEach(function (p) { total++; if (inCart(p.id)) done++; });
    });

    var pending = S.cart.length;
    if (S.error) setSync('Nincs kapcsolat – a pipák megmaradnak', 'var(--error)');
    else if (pending > 0) setSync('Az iPad a „Bevásárlás kész” után frissül', 'var(--pending)');
    else setSync('Szinkronban a konyhai iPaddel', 'var(--accent)');

    $('progressText').textContent = total === 0 ? 'Nincs mit venni'
      : (done === total ? 'Minden megvan' : done + ' / ' + total + ' megvan');
    $('bar').style.width = total === 0 ? '0%' : Math.round(done / total * 100) + '%';

    if (!secs.length) {
      $('list').innerHTML = '<div class="card empty"><p class="big">Minden van itthon</p>' +
        '<p class="small">Ha a konyhai iPaden valamiről lekerül a pipa, itt jelenik meg.</p></div>';
    } else {
      $('list').innerHTML = '<div class="sections">' + secs.map(function (s) {
        var secDone = s.items.filter(function (p) { return inCart(p.id); }).length;
        return '<section><div class="sec-head"><h2>' + esc(s.cat.name) + '</h2><span>' + secDone + ' / ' + s.items.length + '</span></div>' +
          '<div class="card">' + s.items.map(function (p) {
            var on = inCart(p.id);
            return '<button type="button" class="row' + (on ? ' is-checked' : '') + '" data-id="' + esc(p.id) + '" aria-pressed="' + (on ? 'true' : 'false') + '">' +
              (on ? '<span class="tick" aria-hidden="true">' + CHECK + '</span>' : '<span class="ring" aria-hidden="true"></span>') +
              '<span class="label">' + esc(p.name) + '</span></button>';
          }).join('') + '</div></section>';
      }).join('') + '</div>';
    }

    var btn = $('finish');
    btn.disabled = pending === 0 || S.saving;
    if (S.saving) btn.innerHTML = 'Szinkronizálás…';
    else if (pending > 0) btn.innerHTML = '<span>Bevásárlás kész</span><span class="count">' + pending + '</span>';
    else btn.innerHTML = 'Bevásárlás kész';
  }

  function renderEdit() {
    setSync('Szerkesztés · minden kamra-termék', null);
    var all = function () { return true; };
    var meta = categoriesWithOrphans(all);

    $('list').innerHTML = '<div class="sections">' + meta.cats.map(function (c) {
      var items = productsIn(c.id, meta.known, all);
      var rows = items.map(function (p) {
        if (S.confirmDel === p.id) {
          return '<div class="erow is-confirm">' +
            '<button type="button" class="del-btn" data-ask="' + esc(p.id) + '" aria-label="Mégse"><span class="del-dot">' + MINUS + '</span></button>' +
            '<span class="name">' + esc(p.name) + '</span>' +
            '<button type="button" class="confirm-del" data-del="' + esc(p.id) + '">Törlés</button></div>';
        }
        return '<div class="erow">' +
          '<button type="button" class="del-btn" data-ask="' + esc(p.id) + '" aria-label="Törlés: ' + esc(p.name) + '"><span class="del-dot">' + MINUS + '</span></button>' +
          '<span class="name">' + esc(p.name) + '</span>' +
          (p.have ? '<span></span>' : '<span class="on-list">listán</span>') + '</div>';
      }).join('');

      var first = items.length ? '' : ' is-first';
      var add;
      if (c.id === '__egyeb') {
        add = '';
      } else if (S.addCat === c.id) {
        add = '<div class="add-form' + first + '">' +
          '<label class="field-label" for="newName">Új termék – ' + esc(c.name) + '</label>' +
          '<input id="newName" type="text" maxlength="60" placeholder="Termék neve" autocomplete="off" autocapitalize="sentences" value="' + esc(S.newName) + '">' +
          (S.addError ? '<p class="form-error">' + esc(S.addError) + '</p>' : '') +
          '<label class="check-line"><input id="addToList" type="checkbox"' + (S.addToList ? ' checked' : '') + '><span>Rögtön a bevásárlólistára</span></label>' +
          '<div class="form-actions"><button type="button" class="btn-secondary" data-cancel-add="1"' + (S.adding ? ' disabled' : '') + '>Mégse</button>' +
          '<button type="button" class="btn-primary" data-confirm-add="1"' + (S.adding ? ' disabled' : '') + '>' + (S.adding ? 'Mentés…' : 'Hozzáadás') + '</button></div>' +
          '</div>';
      } else {
        add = '<button type="button" class="add-row' + first + '" data-add="' + esc(c.id) + '"><span class="add-dot" aria-hidden="true">' + PLUS + '</span><span>Új termék</span></button>';
      }

      return '<section><div class="sec-head"><h2>' + esc(c.name) + '</h2><span>' + items.length + ' termék</span></div>' +
        '<div class="card">' + rows + add + '</div></section>';
    }).join('') + '</div>';
  }

  var noteTimer = null;
  function note(title, body, isError) {
    $('noteTitle').textContent = title;
    $('noteBody').textContent = body;
    $('note').className = 'note' + (isError ? ' is-error' : '');
    $('iconOk').style.display = isError ? 'none' : 'block';
    $('iconErr').style.display = isError ? 'block' : 'none';
    $('note').hidden = false;
    clearTimeout(noteTimer);
    noteTimer = setTimeout(function () { $('note').hidden = true; }, isError ? 8000 : 4000);
  }

  /* ---------------- Bevásárlás ---------------- */

  function toggle(id) {
    if (S.saving) return;
    if (inCart(id)) S.cart = S.cart.filter(function (x) { return x !== id; });
    else S.cart.push(id);
    saveCart();
    render();
  }

  function finish() {
    if (S.saving || !S.cart.length) return;
    var ids = S.cart.slice();
    S.saving = true;
    render();
    server()
      .withSuccessHandler(function () {
        S.saving = false;
        S.error = false;
        S.cart = S.cart.filter(function (id) { return ids.indexOf(id) === -1; });
        saveCart();
        S.data.products.forEach(function (p) {
          if (ids.indexOf(p.id) !== -1) { p.have = true; p.missingSince = 0; }
        });
        note(ids.length + ' tétel bekerült a kamrába', 'A konyhai iPaden ezek már „van itthon” jelöléssel szerepelnek.', false);
        render();
      })
      .withFailureHandler(function () {
        S.saving = false;
        S.error = true;
        note('Nem sikerült szinkronizálni', 'Ellenőrizd a netkapcsolatot, és próbáld újra. A pipák megmaradnak.', true);
        render();
      })
      .finishShopping(KEY, ids);
  }

  /* ---------------- Szerkesztés ---------------- */

  function enterEdit() {
    S.mode = 'edit';
    S.confirmDel = null;
    S.addCat = null;
    render();
    window.scrollTo(0, 0);
  }

  function exitEdit() {
    S.mode = 'list';
    S.confirmDel = null;
    S.addCat = null;
    S.addError = '';
    render();
    window.scrollTo(0, 0);
    load();
  }

  function findIndex(id) {
    for (var i = 0; i < S.data.products.length; i++) if (S.data.products[i].id === id) return i;
    return -1;
  }

  function removeProduct(id) {
    var idx = findIndex(id);
    if (idx === -1) return;
    var removed = S.data.products.splice(idx, 1)[0];
    var wasInCart = inCart(id);
    S.cart = S.cart.filter(function (x) { return x !== id; });
    saveCart();
    S.confirmDel = null;
    render();
    server()
      .withSuccessHandler(function () {})
      .withFailureHandler(function (err) {
        S.data.products.splice(idx, 0, removed);
        if (wasInCart) { S.cart.push(id); saveCart(); }
        render();
        note('Nem sikerült törölni', (err && err.message) || 'Ellenőrizd a netkapcsolatot, és próbáld újra.', true);
      })
      .deleteProduct(KEY, id);
  }

  function openAdd(catId) {
    S.addCat = catId;
    S.newName = '';
    S.addError = '';
    S.addToList = true;
    S.confirmDel = null;
    render();
    setTimeout(function () {
      var input = $('newName');
      if (input) { try { input.focus(); } catch (e) {} }
    }, 30);
  }

  function cancelAdd() {
    S.addCat = null;
    S.newName = '';
    S.addError = '';
    render();
  }

  function confirmAdd() {
    if (S.adding || !S.addCat) return;
    var input = $('newName');
    if (input) S.newName = input.value;
    var box = $('addToList');
    if (box) S.addToList = box.checked;
    var name = S.newName.replace(/\s+/g, ' ').trim();
    var catId = S.addCat;
    if (!name) { S.addError = 'Adj meg egy nevet.'; render(); return; }
    var lower = name.toLowerCase();
    if (S.data.products.some(function (p) { return p.catId === catId && p.name.toLowerCase() === lower; })) {
      S.addError = 'Ez a termék már szerepel ebben a kategóriában.';
      render();
      return;
    }
    S.adding = true;
    S.addError = '';
    render();
    server()
      .withSuccessHandler(function (product) {
        S.adding = false;
        S.data.products.push(product);
        S.addCat = null;
        S.newName = '';
        render();
      })
      .withFailureHandler(function (err) {
        S.adding = false;
        S.addError = (err && err.message) || 'Nem sikerült menteni. Ellenőrizd a netkapcsolatot.';
        render();
      })
      .addProduct(KEY, catId, name, !S.addToList);
  }

  /* ---------------- Események ---------------- */

  $('list').addEventListener('click', function (e) {
    var t = e.target;
    var el;
    if (S.mode === 'list') {
      el = closest(t, '[data-id]');
      if (el) toggle(el.getAttribute('data-id'));
      return;
    }
    if ((el = closest(t, '[data-del]'))) { removeProduct(el.getAttribute('data-del')); return; }
    if ((el = closest(t, '[data-ask]'))) {
      var id = el.getAttribute('data-ask');
      S.confirmDel = S.confirmDel === id ? null : id;
      render();
      return;
    }
    if ((el = closest(t, '[data-add]'))) { openAdd(el.getAttribute('data-add')); return; }
    if (closest(t, '[data-cancel-add]')) { cancelAdd(); return; }
    if (closest(t, '[data-confirm-add]')) { confirmAdd(); return; }
  });
  $('list').addEventListener('input', function (e) {
    if (e.target.id === 'newName') S.newName = e.target.value;
  });
  $('list').addEventListener('change', function (e) {
    if (e.target.id === 'addToList') S.addToList = e.target.checked;
  });
  $('list').addEventListener('keydown', function (e) {
    if (e.target.id === 'newName' && (e.key === 'Enter' || e.keyCode === 13)) { e.preventDefault(); confirmAdd(); }
  });
  $('modeBtn').addEventListener('click', function () {
    if (S.mode === 'edit') exitEdit(); else enterEdit();
  });
  $('finish').addEventListener('click', finish);
  $('noteClose').addEventListener('click', function () {
    clearTimeout(noteTimer);
    $('note').hidden = true;
  });
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) load();
  });

  load();
  setInterval(function () { if (!document.hidden) load(); }, REFRESH_MS);
})();
</script>
</body>
</html>
